<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G_chair 上位机 · 实时监控与调参</title>
<style>
  body{font-family:-apple-system,"Segoe UI",sans-serif;margin:14px;background:#11141a;color:#e8eaed}
  h1{font-size:19px;margin:0 0 10px}
  .card{background:#1a1e26;border:1px solid #2a303a;border-radius:10px;padding:13px;margin-bottom:12px}
  h2{font-size:13px;color:#9aa0aa;margin:0 0 9px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .kv{display:inline-block;min-width:80px;color:#9aa0aa}
  .ok{color:#4ade80}.bad{color:#f87171}.warnc{color:#fbbf24}
  canvas{background:#0d0f13;border-radius:6px}
  .legend{font-size:11px;color:#9aa0aa;margin-top:4px}
  button{background:#2a6df0;color:#fff;border:0;border-radius:6px;padding:6px 11px;margin:2px;cursor:pointer;font-size:12px}
  button:hover{background:#3d7ff5}
  input[type=range]{width:100%;accent-color:#2a6df0}
  .pr{display:flex;align-items:center;gap:8px;margin:7px 0}
  .pr label{min-width:95px;font-size:12px;color:#c9ced6}
  .pr input[type=number]{width:56px;background:#0d0f13;border:1px solid #374151;color:#e8eaed;border-radius:4px;padding:3px;text-align:right}
  .pr .val{min-width:46px;text-align:right;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<h1>🎛️ G_chair 上位机 — 实时监控 / 在线调参</h1>
<div id="alarm" style="display:none;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-weight:bold"></div>
<div id="top" class="card"></div>

<div class="row">
  <div class="card" style="flex:1;min-width:250px">
    <h2>状态</h2><div id="status"></div>
  </div>
  <div class="card" style="flex:2;min-width:430px">
    <h2>6 缸位移曲线 (mm) 实线=实际 / 虚线=目标</h2>
    <canvas id="chart" width="640" height="210"></canvas>
    <div class="legend" id="speedInfo"></div>
  </div>
  <div class="card" style="min-width:220px">
    <h2>在线调参（实时生效）</h2>
    <div class="pr"><label>低通 tau (s)</label><input type="range" id="lpf" min="0" max="0.6" step="0.01" value="0.15"><span class="val" id="lpfv">0.15</span></div>
    <div class="pr"><label>洗出 tau (s)</label><input type="range" id="wash" min="0" max="8" step="0.1" value="2.5"><span class="val" id="washv">2.5</span></div>
    <div class="pr"><label>最大缸速 mm/s</label><input type="range" id="spd" min="0" max="128" step="1" value="110"><span class="val" id="spdv">110</span></div>
    <div style="border-top:1px solid #2a303a;margin-top:8px;padding-top:6px;font-size:11px;color:#9aa0aa">体感增益</div>
    <div class="pr"><label>侧倾 roll</label><input type="range" id="groll" min="0" max="60" step="1" value="35"><span class="val" id="grollv">35</span></div>
    <div class="pr"><label>俯仰 pitch</label><input type="range" id="gpitch" min="0" max="60" step="1" value="30"><span class="val" id="gpitchv">30</span></div>
    <div class="pr"><label>偏航 yaw</label><input type="range" id="gyaw" min="0" max="30" step="0.5" value="10"><span class="val" id="gyawv">10</span></div>
    <div class="pr"><label>横移 sway</label><input type="range" id="gsway" min="0" max="200" step="5" value="100"><span class="val" id="gswayv">100</span></div>
    <button onclick="applyParams()">应用参数（自动保存）</button>
    <button onclick="sendParamDirect()">滑块即时应用</button>
    <button onclick="cmd('defaults')" style="background:#374151">恢复默认</button>
    <div class="legend">主控硬件上限 128mm/s；默认 110 留余量<br>断流自动回中位并重置滤波状态</div>
  </div>
</div>

<div class="card">
  <h2>录制 / 复位</h2>
  <button onclick="cmd('record_start')">● 开始录制</button>
  <button onclick="cmd('record_stop')">■ 停止并保存 CSV</button>
  <button onclick="cmd('reset')">重置滤波状态</button>
  <div class="legend">保存到 output/host_app_log.csv</div>
</div>

<script>
const WS = 'ws://' + location.hostname + ':WS_PORT';
let ws=null, hist={leg:[[],[],[],[],[],[]]}, dispTarget={leg:[[],[],[],[],[],[]]};
const COLORS=['#f87171','#fbbf24','#4ade80','#38bdf8','#a78bfa','#f472b6'];

function conn(){
  ws=new WebSocket(WS);
  ws.onmessage=e=>{const s=JSON.parse(e.data); update(s);};
  ws.onclose=()=>setTimeout(conn,1000);
}
conn();
function cmd(c,extra){if(ws&&ws.readyState===1)ws.send(JSON.stringify(Object.assign({cmd:c},extra||{})));}

function applyParams(){sendParamDirect();}
function sendParamDirect(){
  const lpf=parseFloat(document.getElementById('lpf').value);
  const wash=parseFloat(document.getElementById('wash').value);
  const spd=parseFloat(document.getElementById('spd').value);
  const gains={roll:parseFloat(document.getElementById('groll').value),
               pitch:parseFloat(document.getElementById('gpitch').value),
               yaw:parseFloat(document.getElementById('gyaw').value),
               sway:parseFloat(document.getElementById('gsway').value)};
  cmd('param',Object.assign({lpf,washout:wash,max_speed:spd},gains));
  document.getElementById('lpfv').textContent=lpf.toFixed(2);
  document.getElementById('washv').textContent=wash.toFixed(1);
  document.getElementById('spdv').textContent=spd.toFixed(0);
  document.getElementById('grollv').textContent=gains.roll.toFixed(0);
  document.getElementById('gpitchv').textContent=gains.pitch.toFixed(0);
  document.getElementById('gyawv').textContent=gains.yaw.toFixed(1);
  document.getElementById('gswayv').textContent=gains.sway.toFixed(0);
}
['lpf','wash','spd','groll','gpitch','gyaw','gsway'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>{
    document.getElementById(id+'v').textContent=document.getElementById(id).value;
  });
});

function update(s){
  // 醒目的安全告警条
  const alarm=document.getElementById('alarm');
  const lim=s.hw.limit||0, wd=s.hw.watchdog||0, lost=s.lost||0;
  const age=s.hw_age;
  let msgs=[];
  if(s.mode==='real' && !s.connected) msgs.push('⛔ 实机模式但未连接主控（检查串口/选择正确端口）');
  else if(s.mode==='real' && age>=0 && age>1.0) msgs.push('⛔ ESP32 状态回传中断 '+age.toFixed(1)+'s（检查串口/WiFi/供电）');
  if(s.tele_stale>1.0) msgs.push('⚠ 遥测数值停滞 '+s.tele_stale.toFixed(1)+'s（游戏暂停或 mod 卡死）');
  if(wd) msgs.push('⚠ 看门狗触发：平台回中位');
  if(lim) msgs.push('⛔ 限位触发：轴 '+[0,1,2,3,4,5].filter(i=>(lim>>i)&1).join(','));
  if(lost>20) msgs.push('⚠ 遥测断流 '+lost+' 帧（请检查游戏机/网络）');
  if(msgs.length){ alarm.style.display='block'; alarm.textContent=msgs.join(' | '); }
  else { alarm.style.display='none'; }
  document.getElementById('top').innerHTML =
    '<b>模式:</b> '+s.mode+' &nbsp; <b>帧数:</b> '+s.frames+' &nbsp; <b>断流帧:</b> '+s.lost+
    ' &nbsp; <b>串口:</b> '+(s.connected?'已连接':'未连接')+
    ' &nbsp; <b>状态帧:</b> '+s.hw.frames;
  const hw=s.hw;
  let h='<div><span class="kv">使能</span><span class="'+(hw.enabled?'ok':'warnc')+'">'+(hw.enabled?'ON':'OFF')+'</span></div>';
  h+='<div><span class="kv">看门狗</span><span class="'+(hw.watchdog?'bad':'ok')+'">'+(hw.watchdog?'回中位':'正常')+'</span></div>';
  h+='<div><span class="kv">状态龄</span><span class="'+((age>1.0)?'bad':'ok')+'">'+(age>=0?age.toFixed(2)+'s':'—')+'</span></div>';
  h+='<div><span class="kv">限位</span>'+[0,1,2,3,4,5].map(i=>'<span class="'+((hw.limit>>i)&1?'bad':'')+'">'+(i)+':'+((hw.limit>>i)&1?'触':'·')+' </span>').join('')+'</div>';
  h+='<div style="margin-top:6px"><b>平台位姿</b></div>';
  const p=s.pose||[0,0,0,0,0,0];
  h+='<div><span class="kv">升沉</span>'+(p[2]*1000).toFixed(1)+' mm</div>';
  h+='<div><span class="kv">roll</span>'+(p[3]*180/Math.PI).toFixed(2)+'°</div>';
  h+='<div><span class="kv">pitch</span>'+(p[4]*180/Math.PI).toFixed(2)+'°</div>';
  h+='<div><span class="kv">yaw</span>'+(p[5]*180/Math.PI).toFixed(2)+'°</div>';
  h+='<div style="margin-top:6px"><b>缸 实际mm / 速度mm/s</b></div>';
  for(let i=0;i<6;i++){
    const sp=s.speed[i]||0;
    h+='<div><span class="kv">缸'+i+'</span>'+s.disp_mm[i].toFixed(1)+' / <span class="'+(sp>128?'bad':'')+'">'+sp.toFixed(0)+'</span></div>';
  }
  document.getElementById('status').innerHTML=h;
  for(let i=0;i<6;i++){
    hist.leg[i].push(s.disp_mm[i]); dispTarget.leg[i].push(s.disp_mm[i]);
    if(hist.leg[i].length>240){hist.leg[i].shift();dispTarget.leg[i].shift();}
  }
  draw();
  const mx=Math.max(...s.speed);
  document.getElementById('speedInfo').innerHTML='最大缸速 <span class="'+(mx>128?'bad':'ok')+'">'+mx.toFixed(0)+'</span> mm/s (上限128)';
  // 同步滑块显示
  if(s.params){
    document.getElementById('lpfv').textContent=s.params.lpf.toFixed(2);
    document.getElementById('washv').textContent=s.params.washout.toFixed(1);
    document.getElementById('spdv').textContent=s.params.max_speed.toFixed(0);
    if(s.params.roll!==undefined){
      document.getElementById('grollv').textContent=s.params.roll.toFixed(0);
      document.getElementById('gpitchv').textContent=s.params.pitch.toFixed(0);
      document.getElementById('gyawv').textContent=s.params.yaw.toFixed(1);
      document.getElementById('gswayv').textContent=s.params.sway.toFixed(0);
    }
  }
}
function draw(){
  const c=document.getElementById('chart'),x=c.getContext('2d'),W=c.width,H=c.height;
  x.clearRect(0,0,W,H);
  x.strokeStyle='#2a303a';x.lineWidth=1;
  for(let v=-100;v<=100;v+=50){const y=H/2-v/100*(H/2-10);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
  x.strokeStyle='#445';x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();
  const n=hist.leg[0].length;
  for(let i=0;i<6;i++){
    x.strokeStyle=COLORS[i];x.lineWidth=1.5;x.beginPath();
    for(let k=0;k<n;k++){const px=k/239*W,py=H/2-hist.leg[i][k]/100*(H/2-10);k?x.lineTo(px,py):x.moveTo(px,py);}
    x.stroke();
  }
}
</script>
</body>
</html>
