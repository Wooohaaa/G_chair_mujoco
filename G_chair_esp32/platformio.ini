[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
upload_speed = 921600

; 带软件急停 GPIO 的版本（画板时预留急停按钮后使用）
; 急停按钮常闭接 PIN_ESTOP(GPIO2)，按下拉低 -> 禁能并停全部轴
[env:esp32-s3-estop]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_ESTOP_GPIO
upload_speed = 921600

; WiFi UDP 版：板子直接收上位机 UDP（填好 include/wifi_config.h 后使用）
; 编译: pio run -e esp32-s3-wifi
[env:esp32-s3-wifi]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_WIFI
upload_speed = 921600
